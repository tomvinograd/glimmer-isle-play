<style>
/* Layout: one phone screen, top to bottom: header, the 9x9 board, tools, number pad. Ink on cool paper, a highlighter-yellow selection. */
:root {

  --btn: #FFFFFF; --btn-press: #E2E8F2; --accent: #2A5FD0; --accent-ink: #FFFFFF; --shade: rgba(27,39,64,.14); --scrim: rgba(14,20,32,.45);
  --font: "Roboto", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1420; --paper: #172033; --ink: #E4EAF6; --muted: #98A4BB;
  --line: #2B3954; --line-strong: #A9B7D0; --peer: #1C2840; --same: #27406B; --sel: #463A0B;
  --user: #84AAFF; --err: #FF7B7B; --err-bg: #4A1E26; --note: #A6B1C6;
  --btn: #1C2740; --btn-press: #26334F; --accent: #3366D6; --accent-ink: #FFFFFF; --shade: rgba(0,0,0,.4); --scrim: rgba(0,0,0,.6);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1420; --paper: #172033; --ink: #E4EAF6; --muted: #98A4BB;
  --line: #2B3954; --line-strong: #A9B7D0; --peer: #1C2840; --same: #27406B; --sel: #463A0B;
  --user: #84AAFF; --err: #FF7B7B; --err-bg: #4A1E26; --note: #A6B1C6;
  --btn: #1C2740; --btn-press: #26334F; --accent: #3366D6; --accent-ink: #FFFFFF; --shade: rgba(0,0,0,.4); --scrim: rgba(0,0,0,.6);
  color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }   /* hidden layers (the pause cover) must never catch taps */
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font); user-select: none; -webkit-user-select: none; overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding-block: calc(10px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }

/* header */
.top { display: flex; align-items: center; gap: 10px; }
.mark { font-weight: 800; font-size: 22px; letter-spacing: -.02em; }
.lvchip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--paper); box-shadow: 0 1px 2px var(--shade); font-weight: 700; font-size: 14px; }
.lvchip small { color: var(--muted); font-weight: 600; }
.lvchip svg { width: 14px; height: 14px; }
.sp { flex: 1; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; min-width: 52px; text-align: right; }
.icbtn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--paper); box-shadow: 0 1px 2px var(--shade); }

.stats { display: flex; gap: 14px; color: var(--muted); font-size: 13px; font-weight: 600; margin-top: -4px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* board */
.boardbox { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; flex: none; align-self: center; container-type: inline-size; --dig: .62; --nt: .78; }
.board { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); grid-template-rows: repeat(9, minmax(0, 1fr));   /* nine equal rows, whatever the font size */
  background: var(--paper); border: 2.5px solid var(--line-strong); border-radius: 6px; overflow: hidden; box-shadow: 0 2px 10px var(--shade); }
.c { position: relative; display: grid; place-items: center; line-height: 1; overflow: hidden; min-width: 0; min-height: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font-size: clamp(20px, 6.6vw, 30px); font-size: calc(100cqw / 9 * var(--dig)); font-weight: 500; font-variant-numeric: tabular-nums; }   /* a share of the square */
.c.br { border-right: 2px solid var(--line-strong); } .c.bb { border-bottom: 2px solid var(--line-strong); }
.c.r9 { border-right: 0; } .c.b9 { border-bottom: 0; }
.c.peer { background: var(--peer); } .c.same { background: var(--same); } .c.sel { background: var(--sel); }
.c.given { font-weight: 700; color: var(--ink); } .c.user { color: var(--user); }
.c.err { color: var(--err); } .c.err:not(.sel) { background: var(--err-bg); }
.c.pop { animation: pop .22s ease-out; }
@keyframes pop { 40% { transform: scale(1.18); } }
.notes { position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr));
  font-size: clamp(8px, 2.4vw, 11px); font-size: calc(100cqw / 27 * var(--nt)); font-weight: 600; color: var(--note); line-height: 1; }
.notes span { display: grid; place-items: center; }
.notes span.hl { color: var(--accent); font-weight: 800; }
.board.paused .c { color: transparent !important; background: var(--paper) !important; }
.board.paused .notes { visibility: hidden; }
.cover { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 12px; text-align: center; }
.cover b { font-size: 22px; font-weight: 800; }

/* tools + pad */
.tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tool { display: grid; justify-items: center; gap: 3px; padding: 8px 0 6px; border-radius: 14px; color: var(--muted); font-size: 12px; font-weight: 700; position: relative; }
.tool svg { width: 24px; height: 24px; color: var(--ink); }
.tool:active { background: var(--btn-press); }
.tool .badge { position: absolute; top: 2px; right: calc(50% - 30px); font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: var(--line); color: var(--muted); }
.tool.on .badge { background: var(--accent); color: var(--accent-ink); }
.tool.on svg { color: var(--accent); }
.pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
.num { display: grid; justify-items: center; padding: 6px 0 5px; border-radius: 12px; background: var(--btn); box-shadow: 0 1px 2px var(--shade); }
.num b { font-size: clamp(22px, 6.6vw, 30px); font-weight: 600; line-height: 1.1; color: var(--user); }   /* the keypad uses the colour of your numbers */
.num small { font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.num:active { background: var(--btn-press); }
.num.gone { visibility: hidden; }
.pad.notes-on .num b { color: var(--note); font-size: clamp(18px, 5vw, 22px); }
.newbtn { align-self: center; padding: 10px 22px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px; box-shadow: 0 2px 6px var(--shade); }

/* sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; margin: 0 auto; max-width: 480px; background: var(--paper); border-radius: 22px 22px 0 0;
  padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; animation: up .25s cubic-bezier(.2,1,.4,1); max-height: 92%; overflow-y: auto; }
@keyframes up { from { transform: translateY(40%); opacity: 0; } }
.sheet h2 { margin: 0; font-size: 20px; font-weight: 800; }
.lvbig { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.lvbig b { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.lvbig small { color: var(--muted); font-weight: 700; }
.range { width: 100%; accent-color: var(--accent); height: 32px; }
.ticks { display: flex; justify-content: space-between; margin-top: -10px; padding: 0 6px; color: var(--muted); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
.about { margin: 0; color: var(--muted); font-size: 14px; }
.about b { color: var(--ink); }
.presets { display: flex; gap: 8px; flex-wrap: wrap; }
.presets button { padding: 7px 12px; border-radius: 999px; background: var(--bg); font-weight: 700; font-size: 13px; }
.presets button.on { background: var(--accent); color: var(--accent-ink); }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; font-weight: 600; }
.sw { width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.sw.on { background: var(--accent); } .sw.on::after { transform: translateX(18px); }
.row2 { display: flex; gap: 10px; }
.big { flex: 1; padding: 13px; border-radius: 14px; font-weight: 800; font-size: 16px; background: var(--bg); }
.big.go { background: var(--accent); color: var(--accent-ink); }
.making { display: grid; place-items: center; gap: 10px; padding: 20px 0; color: var(--muted); font-weight: 700; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ver { margin: -4px 0 0; text-align: center; color: var(--muted); font-size: 12px; font-weight: 600; }
.ver:empty { display: none; }
.winhead { text-align: center; display: grid; gap: 2px; }
.winhead b { font-size: 28px; font-weight: 800; }
.winhead span { color: var(--muted); font-weight: 600; }
.winstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.winstats div { background: var(--bg); border-radius: 14px; padding: 10px 6px; text-align: center; display: grid; gap: 2px; }
.winstats b { font-size: 20px; font-variant-numeric: tabular-nums; }
.winstats small { color: var(--muted); font-weight: 700; font-size: 12px; }
.best { text-align: center; color: var(--muted); font-weight: 600; margin: -6px 0 0; }
.best b { color: var(--ink); }
.board.won .c { animation: wave .5s ease-out both; }
@keyframes wave { 40% { background: var(--sel); } }
.c.flash { animation: flash .6s ease-out both; }
@keyframes flash { 30% { background: var(--sel); transform: scale(1.08); } }

/* start page */
.mark { display: flex; align-items: center; gap: 4px; }
.mark svg { width: 18px; height: 18px; color: var(--muted); }
.home { position: fixed; inset: 0; z-index: 15; background: var(--bg); display: flex; flex-direction: column; align-items: center; overflow-y: auto;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.home[hidden] { display: none; }
.hin { width: 100%; max-width: 420px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
.hart { align-self: center; margin-top: 0; width: min(150px, 40vw); aspect-ratio: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; transform: rotate(-4deg); }
.hart span { border-radius: 10px; background: var(--paper); box-shadow: 0 2px 6px var(--shade); display: grid; place-items: center; font-size: clamp(22px, 6.4vw, 30px); font-weight: 700; color: var(--ink); }
.hart span.u { color: var(--user); } .hart span.y { background: var(--sel); } .hart span.e { color: transparent; }
.hart span:nth-child(odd) { animation: bob 3.2s ease-in-out infinite; } .hart span:nth-child(3n) { animation-delay: -1.1s; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.htitle { text-align: center; display: grid; gap: 4px; }
.htitle b { font-size: 38px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.htitle span { color: var(--muted); font-weight: 600; }
.hbtns { display: grid; gap: 10px; margin-top: 6px; }
.hbtn { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: var(--paper); box-shadow: 0 1px 3px var(--shade); text-align: left; }
.hbtn > span { flex: 1; display: grid; gap: 1px; } .hbtn b { font-size: 18px; font-weight: 800; } .hbtn small { color: var(--muted); font-weight: 600; font-size: 13px; }
.hbtn i { font-style: normal; font-size: 22px; color: var(--muted); }
.hbtn.go { background: var(--accent); color: var(--accent-ink); } .hbtn.go small, .hbtn.go i { color: var(--accent-ink); opacity: .85; }
.hbtn:active { transform: translateY(1px); }
.hrec { display: grid; gap: 8px; } .hrec h3 { margin: 0; font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.hrecs { display: flex; flex-wrap: wrap; gap: 6px; }
.hrecs span { padding: 6px 10px; border-radius: 999px; background: var(--paper); font-size: 13px; font-weight: 600; color: var(--muted); }
.hrecs span b { color: var(--ink); font-variant-numeric: tabular-nums; }
.hlook { display: grid; gap: 8px; } .hlook h3 { margin: 0; font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 14px; background: var(--paper); box-shadow: 0 1px 3px var(--shade); }
.seg button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 4px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button svg { width: 17px; height: 17px; flex: none; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.hcrow { padding: 6px 2px 0; }
.hfoot { margin-top: auto; text-align: center; color: var(--muted); font-size: 12px; font-weight: 600; }
/* what's new note after an update */
.news { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; width: min(440px, calc(100% - 32px));
  background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 20px var(--shade); animation: newsin .35s cubic-bezier(.2,1,.4,1); }
.news div { flex: 1; display: grid; gap: 2px; font-size: 13px; } .news b { font-size: 15px; }
.news button { padding: 8px 12px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 800; }
@keyframes newsin { from { transform: translate(-50%, 30px); opacity: 0; } }
.news.attop { bottom: auto; top: calc(12px + env(safe-area-inset-top, 0px)); }   /* a sheet is open: never cover its buttons */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-height: 640px) { .newbtn { display: none; } .app { gap: 8px; } .wrap { gap: 8px; } }

/* High contrast (start page switch): stronger colours for light and dark, outlined controls, heavier numbers */
:root { --edge: transparent; --selring: #000000; }
:root[data-contrast="high"] { --bg: #FFFFFF; --paper: #FFFFFF; --ink: #000000; --muted: #2B2B2B;
  --line: #5C5C5C; --line-strong: #000000; --peer: #D9E4F7; --same: #A8C5F7; --sel: #FFD000;
  --user: #0033AA; --err: #A80000; --err-bg: #FFC9C9; --note: #000000;
  --btn: #FFFFFF; --btn-press: #D9D9D9; --accent: #0033AA; --accent-ink: #FFFFFF; --shade: rgba(0,0,0,0); --scrim: rgba(0,0,0,.7); --edge: #000000; }
@media (prefers-color-scheme: dark) { :root[data-contrast="high"]:not([data-theme="light"]) { --bg: #000000; --paper: #000000; --ink: #FFFFFF; --muted: #E6E6E6;
  --line: #A6A6A6; --line-strong: #FFFFFF; --peer: #1E2B47; --same: #1F3A6E; --sel: #3F3200;
  --user: #8FD0FF; --err: #FF8F8F; --err-bg: #5C0000; --note: #FFFFFF;
  --btn: #000000; --btn-press: #262626; --accent: #8FD0FF; --accent-ink: #000000; --shade: rgba(0,0,0,0); --scrim: rgba(0,0,0,.8); --edge: #FFFFFF; --selring: #FFD000; } }
:root[data-contrast="high"][data-theme="dark"] { --bg: #000000; --paper: #000000; --ink: #FFFFFF; --muted: #E6E6E6;
  --line: #A6A6A6; --line-strong: #FFFFFF; --peer: #1E2B47; --same: #1F3A6E; --sel: #3F3200;
  --user: #8FD0FF; --err: #FF8F8F; --err-bg: #5C0000; --note: #FFFFFF;
  --btn: #000000; --btn-press: #262626; --accent: #8FD0FF; --accent-ink: #000000; --shade: rgba(0,0,0,0); --scrim: rgba(0,0,0,.8); --edge: #FFFFFF; --selring: #FFD000; }
:root[data-contrast="high"] .c { border-color: var(--line); }
:root[data-contrast="high"] .c.user { font-weight: 700; }
:root[data-contrast="high"] .c.sel { box-shadow: inset 0 0 0 3px var(--selring); }
:root[data-contrast="high"] .notes { font-weight: 800; } :root[data-contrast="high"] .boardbox { --nt: .86; }
:root[data-contrast="high"] .board { border-width: 3px; }
:root[data-contrast="high"] .c.br { border-right-width: 3px; } :root[data-contrast="high"] .c.bb { border-bottom-width: 3px; }
:root[data-contrast="high"] .num, :root[data-contrast="high"] .hbtn, :root[data-contrast="high"] .lvchip, :root[data-contrast="high"] .icbtn,
:root[data-contrast="high"] .seg, :root[data-contrast="high"] .hrecs span, :root[data-contrast="high"] .hart span, :root[data-contrast="high"] .big,
:root[data-contrast="high"] .presets button { border: 2px solid var(--edge); }
:root[data-contrast="high"] .sheet { border-top: 3px solid var(--edge); }
:root[data-contrast="high"] .tool, :root[data-contrast="high"] .stats, :root[data-contrast="high"] .num small { color: var(--ink); }
:root[data-contrast="high"] .tool .badge { border: 1.5px solid var(--edge); background: var(--paper); color: var(--ink); }
:root[data-contrast="high"] .tool.on .badge { background: var(--accent); color: var(--accent-ink); }
:root[data-contrast="high"] .sw { border: 2px solid var(--edge); }

/* colour of the numbers you enter (start page: Your numbers). printed = the same colour as the printed numbers, lighter weight */
:root[data-ucolor="printed"] { --user: var(--ink) !important; }

:root[data-contrast="high"][data-ucolor="green"][data-theme="dark"] { --user: #7DFFAA; }
:root[data-ucolor="purple"] { --user: #7B2FBF; }
@media (prefers-color-scheme: dark) { :root[data-ucolor="purple"]:not([data-theme="light"]) { --user: #D3A6FF; } }
:root[data-ucolor="purple"][data-theme="dark"] { --user: #D3A6FF; }

@media (prefers-color-scheme: dark) { :root[data-contrast="high"][data-ucolor="purple"]:not([data-theme="light"]) { --user: #E2C2FF; } }
:root[data-contrast="high"][data-ucolor="purple"][data-theme="dark"] { --user: #E2C2FF; }
.ucol { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ucol button { display: grid; justify-items: center; gap: 2px; padding: 8px 2px 6px; border-radius: 12px; background: var(--paper); box-shadow: 0 1px 3px var(--shade); border: 2px solid transparent; }
.ucol button b { font-size: 26px; line-height: 1.1; font-weight: 500; }

:root[data-contrast="high"] .tiles div, :root[data-contrast="high"] .chart, :root[data-contrast="high"] .badge, :root[data-contrast="high"] .drow,

/* ==== GAMES CSS BEGIN (game/src/games.css) ==== */
/* ---------- brain games: the menu tiles, the shared game screen, and each game's pieces ---------- */
:root { --tap: 56px; --fs: 1; }
:root[data-size="large"] { --tap: 66px; --fs: 1.12; }
:root[data-size="xl"] { --tap: 76px; --fs: 1.25; }
.htitle.hub b { font-size: 34px; }
.gtiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; }

.gtile { display: grid; justify-items: start; align-content: start; gap: 2px; padding: 12px 14px 13px; border-radius: 16px; background: var(--paper); box-shadow: 0 1px 3px var(--shade); text-align: left; min-height: 104px; }
.gtile i { font-style: normal; font-size: calc(30px * var(--fs)); line-height: 1.15; }
.gtile b { font-size: calc(16px * var(--fs)); font-weight: 800; line-height: 1.2; }

.gtile:active { transform: translateY(1px); }

:root[data-contrast="high"] .gtile small { color: var(--ink); }

.mg { position: fixed; inset: 0; z-index: 17; background: var(--bg); display: flex; justify-content: center;
  padding-block: calc(10px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.mgin { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.mghead { display: flex; align-items: center; gap: 10px; }
.mghead .t { flex: 1; min-width: 0; font-size: calc(21px * var(--fs)); font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pback.q { font-weight: 800; font-size: 20px; }
.mgstat { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 16px; min-height: 24px; font-weight: 700; color: var(--muted); font-size: calc(15px * var(--fs)); }
.mgstat b { color: var(--ink); font-variant-numeric: tabular-nums; }
.mgstat .lives { color: var(--err); letter-spacing: .1em; }
.mgbody { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; position: relative; }
.mgfoot { display: grid; gap: 8px; }
.mgfoot:empty { display: none; }
.mgmsg { margin: 0; text-align: center; font-size: calc(21px * var(--fs)); font-weight: 800; }
.mgmsg.ok { color: #1E8A4C; } .mgmsg.bad { color: var(--err); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mgmsg.ok { color: #6EE69A; } }
:root[data-theme="dark"] .mgmsg.ok { color: #6EE69A; }
.mgsub { margin: 0; text-align: center; color: var(--muted); font-weight: 600; font-size: calc(15px * var(--fs)); }
.mgsub b { color: var(--ink); }
:root[data-contrast="high"] .mgsub, :root[data-contrast="high"] .mgstat { color: var(--ink); }
.bigbtn { min-height: var(--tap); padding: 0 22px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: calc(18px * var(--fs)); box-shadow: 0 2px 6px var(--shade); }
.bigbtn.alt { background: var(--paper); color: var(--ink); }
.bigbtn:disabled { opacity: .45; }
:root[data-contrast="high"] .bigbtn { border: 2px solid var(--edge); }
.mgintro { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.mgic { font-size: calc(64px * var(--fs)); line-height: 1; }
.mghow { margin: 0; font-size: calc(16px * var(--fs)); line-height: 1.5; font-weight: 500; max-width: 30em; }
.stepper { display: grid; grid-template-columns: var(--tap) 1fr var(--tap); align-items: center; gap: 10px; width: 100%; max-width: 380px; }
.stepper > button { height: var(--tap); border-radius: 16px; background: var(--paper); box-shadow: 0 1px 3px var(--shade); font-size: calc(30px * var(--fs)); font-weight: 700; line-height: 1; }
.stepper > button:disabled { opacity: .3; }
.stepper div { display: grid; gap: 2px; } .stepper b { font-size: calc(22px * var(--fs)); font-weight: 800; } .stepper small { color: var(--muted); font-weight: 700; font-size: calc(14px * var(--fs)); }
:root[data-contrast="high"] .stepper > button { border: 2px solid var(--edge); }

/* Pairs */
.cards, .pads, .sqs { display: grid; gap: var(--gap, 8px); }
.card { width: var(--cell); height: var(--cell); border-radius: 12px; background: var(--accent); box-shadow: 0 2px 4px var(--shade); display: grid; place-items: center; position: relative; }
.card .back { color: var(--accent-ink); opacity: .55; font-weight: 800; font-size: calc(var(--cell) * .38); }
.card .back::before { content: "?"; }
.card .face { display: none; font-size: calc(var(--cell) * .56); line-height: 1; }
.card.up { background: var(--paper); animation: flipin .22s ease-out; }
.card.up .face { display: block; } .card.up .back { display: none; }
.card.done { background: var(--same); box-shadow: none; }
@keyframes flipin { from { transform: scaleX(.1); } }
:root[data-contrast="high"] .card { border: 2px solid var(--edge); }

/* Repeat the sequence */
.spad { width: var(--cell); height: var(--cell); border-radius: 22px; color: #fff; font-weight: 800; font-size: calc(var(--cell) * .38); display: grid; place-items: center;
  transition: transform .08s, filter .08s, box-shadow .08s; box-shadow: 0 3px 6px var(--shade); }

/* Number memory */
.digits { font-size: var(--dfs, 48px); font-weight: 800; letter-spacing: .08em; font-variant-numeric: tabular-nums; text-align: center; line-height: 1.1; word-break: break-all; }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }

.kpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 440px; }

:root[data-contrast="high"] .kpad button { border: 2px solid var(--edge); }

/* Shopping list / What changed? / Same as before? / Story questions */
.items { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; overflow-y: auto; align-content: start; max-height: 100%; padding: 2px; }
:root[data-size="xl"] .items.pick { grid-template-columns: 1fr; }
.item { display: flex; align-items: center; gap: 10px; min-height: var(--tap); padding: 6px 12px; border-radius: 14px; background: var(--paper); box-shadow: 0 1px 2px var(--shade); text-align: left; font-weight: 700; font-size: calc(17px * var(--fs)); }

.item.on { box-shadow: inset 0 0 0 3px var(--accent); background: var(--same); }

:root[data-contrast="high"] .item { border: 2px solid var(--edge); }
.studybar { width: 100%; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }

:root[data-contrast="high"] .slot { border: 2px solid var(--edge); }

/* each square draws only its top and left edge, so a cage line is never doubled; the board's own border closes the right and bottom */
.ncc.bt { border-top: 3px solid var(--line-strong); } .ncc.bl { border-left: 3px solid var(--line-strong); }

/* daily workout card on the menu; game picker on the stats page */

<script>
(() => {
"use strict";
/* ---------- difficulty ---------- */
// clues: how many numbers are given; singles: must be solvable by simple steps only; tough: must NOT be.
const LEVELS = [
  { name: "Beginner", clues: 50, singles: true },
  { name: "Easy", clues: 44, singles: true },
  { name: "Easy+", clues: 40, singles: true },
  { name: "Medium", clues: 36, singles: true },
  { name: "Medium+", clues: 33, singles: true },
  { name: "Hard", clues: 30 },
  { name: "Hard+", clues: 29, tough: true },
  { name: "Expert", clues: 27, tough: true },
  { name: "Master", clues: 25, tough: true },
  { name: "Extreme", clues: 23, tough: true },
];

/* ---------- solver ---------- */
const ROW = [], COL = [], BOX = [], PEERS = [];
for (let i = 0; i < 81; i++) { ROW[i] = Math.floor(i / 9); COL[i] = i % 9; BOX[i] = Math.floor(ROW[i] / 3) * 3 + Math.floor(COL[i] / 3); }
for (let i = 0; i < 81; i++) { PEERS[i] = []; for (let j = 0; j < 81; j++) if (j !== i && (ROW[j] === ROW[i] || COL[j] === COL[i] || BOX[j] === BOX[i])) PEERS[i].push(j); }
const UNITS = [];
for (let k = 0; k < 9; k++) { UNITS.push([...Array(81).keys()].filter(i => ROW[i] === k)); UNITS.push([...Array(81).keys()].filter(i => COL[i] === k)); UNITS.push([...Array(81).keys()].filter(i => BOX[i] === k)); }
const pop = m => { let n = 0; while (m) { m &= m - 1; n++; } return n; };
// rnd: Math.random, or a seeded generator while the daily puzzle is made (same date = same puzzle on every phone)
let rnd = Math.random;
const seeded = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hashStr = x => { let h = 2166136261; for (const c of x) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// Count solutions up to `limit`; `random` fills a grid in random order (used to make a full solution).
function search(cells, limit, random) {
  const g = cells.slice(), r = new Array(9).fill(0), c = new Array(9).fill(0), b = new Array(9).fill(0);
  for (let i = 0; i < 81; i++) if (g[i]) { const m = 1 << (g[i] - 1); r[ROW[i]] |= m; c[COL[i]] |= m; b[BOX[i]] |= m; }
  let n = 0, first = null;
  (function rec() {
    let best = -1, bm = 0, bc = 10;
    for (let i = 0; i < 81; i++) if (!g[i]) {
      const m = ~(r[ROW[i]] | c[COL[i]] | b[BOX[i]]) & 511, k = pop(m);
      if (!k) return;
      if (k < bc) { bc = k; best = i; bm = m; if (k === 1) break; }
    }
    if (best < 0) { n++; if (!first) first = g.slice(); return; }
    const ds = []; for (let d = 0; d < 9; d++) if (bm & (1 << d)) ds.push(d);
    if (random) shuffle(ds);
    for (const d of ds) {
      const m = 1 << d; g[best] = d + 1; r[ROW[best]] |= m; c[COL[best]] |= m; b[BOX[best]] |= m;
      rec();
      g[best] = 0; r[ROW[best]] &= ~m; c[COL[best]] &= ~m; b[BOX[best]] &= ~m;
      if (n >= limit) return;
    }
  })();
  return { n, first };
}
const countSolutions = (p, limit) => search(p, limit, false).n;
const fullGrid = () => search(new Array(81).fill(0), 1, true).first;

// Solvable by simple steps only: a cell with one possible number, or a number with one possible cell in a row, column or box.
function singlesSolve(p) {
  const g = p.slice();
  for (let moved = true; moved;) {
    moved = false;
    const cand = new Array(81).fill(0);
    for (let i = 0; i < 81; i++) if (!g[i]) { let used = 0; for (const j of PEERS[i]) if (g[j]) used |= 1 << (g[j] - 1); cand[i] = ~used & 511; if (!cand[i]) return false; }
    for (let i = 0; i < 81; i++) if (!g[i] && pop(cand[i]) === 1) { g[i] = Math.log2(cand[i]) + 1; moved = true; }
    if (moved) continue;
    for (const u of UNITS) for (let d = 0; d < 9; d++) {
      const m = 1 << d; if (u.some(i => g[i] === d + 1)) continue;
      const spots = u.filter(i => !g[i] && cand[i] & m);
      if (spots.length === 1) { g[spots[0]] = d + 1; moved = true; }
    }
  }
  return g.every(v => v);
}

// One try at a puzzle for a level: remove numbers in mirrored pairs while the answer stays unique.
function tryPuzzle(L) {
  const sol = fullGrid(), p = sol.slice(); let givens = 81;
  for (const i of shuffle([...Array(41).keys()])) {
    if (givens <= L.clues) break;
    const j = 80 - i, out = i === j ? 1 : 2;
    if (givens - out < L.clues - 1) continue;
    const vi = p[i], vj = p[j]; p[i] = 0; p[j] = 0;
    if (countSolutions(p, 2) === 1 && (!L.singles || singlesSolve(p))) givens -= out; else { p[i] = vi; p[j] = vj; }
  }
  const simple = singlesSolve(p);
  const score = Math.abs(givens - L.clues) + (L.tough && simple ? 6 : 0);
  return { p, sol, givens, simple, score };
}
// Several tries spread over animation frames so the screen stays alive; keeps the best.
function makePuzzle(lv) {
  const L = LEVELS[lv - 1], budget = L.tough ? 2600 : 900, t0 = performance.now();
  return new Promise(res => {
    let best = null;
    (function step() {
      const r = tryPuzzle(L);
      if (!best || r.score < best.score) best = r;
      if (best.score === 0 || performance.now() - t0 > budget) res(best); else setTimeout(step, 0);
    })();
  });
}

/* ---------- the daily puzzle ---------- */
// One puzzle a day, the same on every phone: made from the date with a seeded generator and a fixed number of tries
// (never a time limit, which would differ between phones). Easy on Monday, harder each day, Expert on Sunday.
// Keep this generator unchanged, or phones on different game versions would get different daily puzzles.
const DAILY_LV = [8, 2, 3, 4, 5, 6, 7];   // Sunday .. Saturday
const WEEKDAY = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const dayKey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const keyDate = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = keyDate(k); d.setDate(d.getDate() + n); return dayKey(d); };
const dailyLevel = k => DAILY_LV[keyDate(k).getDay()];
const dayLabel = k => k === dayKey() ? "Today" : k === addDays(dayKey(), -1) ? "Yesterday" : keyDate(k).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
function makeDaily(k) {
  const lv = dailyLevel(k), L = LEVELS[lv - 1], was = rnd; let best = null;
  rnd = seeded(hashStr("tvsudoku-daily-" + k));
  try { for (let n = 0; n < 200 && !(best && best.score === 0); n++) { const r = tryPuzzle(L); if (!best || r.score < best.score) best = r; } }

  const xl = `<text class="ax" x="${L}" y="${H - 4}">${n > 1 ? "older" : ""}</text><text class="ax" x="${W - R}" y="${H - 4}" text-anchor="end">latest</text>`;

/* ---------- play a friend (two phones) ---------- */
// Both phones post small messages to a free public relay (ntfy.sh), under a topic made from the game code: the puzzle ("start"),
// "go" (the friend joined or said yes to a rematch), progress (at most every 15 s: the relay allows about 250 messages a day

// "the first 'done' in the list wins" gives both the same result. Everything is worked out again from the list after a reload.

const topicOf = c => RELAY + "tvsudoku-" + c;

function toast(html) {

  n.innerHTML = `<div><span>${html}</span></div><button>OK</button>`;

async function vsPost(o, v = V, tries = 4) {

    } catch (e) { if (v === V) vsNet(false); }

/* ==== GAMES JS BEGIN (game/src/games.js) ==== */
/* ---------- brain games ----------
   A shared frame for every game except Sudoku: a menu tile, an intro page (how to play + level), the play screen
   (header, a status line, the game's area) and a result sheet that records the score, best per level, streak and badges.
   Each game is one object: { id, name, icon, sec ("mem" memory | "think" puzzles), blurb, how, levels, levelName(l),
   better ("high" | "low"), fmt(score), start(c) }. start() draws into c.body and ends with c.done({ score, lines, ... }).
   Relaxed mode (Settings) gives more time to look and no countdowns. */

const mgEl = $("mg");

function mgStat(id) { opts.mgs = opts.mgs || {}; return opts.mgs[id] || (opts.mgs[id] = { best: {}, plays: 0, lv: 1 }); }
const mgRead = id => (opts.mgs || {})[id];
const BACK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
// one tone (the sequence game's pads), same switch as the other sounds
function beep(f, dur = .3, vol = .07) {
  if (opts.sound === false) return; const a = audio(); if (!a) return; sfxCount++;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain(); o.type = "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .03);
}
// square cells as big as the game's area allows (cols x rows), again whenever the screen changes
function fitGrid(grid, cols, rows, box, gap = 8, maxCell = 150) {
  grid.style.setProperty("--gap", gap + "px");
  const fit = () => {
    const W = box.clientWidth, H = box.clientHeight - (box.dataset.reserve | 0);
    const s = Math.floor(Math.min((W - gap * (cols - 1)) / cols, (H - gap * (rows - 1)) / rows, maxCell));
    grid.style.setProperty("--cell", Math.max(28, s) + "px");
    grid.style.gridTemplateColumns = `repeat(${cols}, var(--cell))`;
  };
  fit(); requestAnimationFrame(fit); mgFit = fit;
}
addEventListener("resize", () => mgFit && mgFit());

/* the daily workout: three short games a day, the same three for everyone (from the date): two memory games and a puzzle */
function workoutToday() {
  const k = dayKey(); if (opts.wk && opts.wk.d === k && opts.wk.ids.every(id => MGI[id])) return opts.wk;
  const was = rnd; rnd = seeded(hashStr("tvsudoku-workout-" + k));
  let ids; try { ids = [...shuffle(GAMES.filter(g => g.sec === "mem").map(g => g.id)).slice(0, 2), shuffle(GAMES.filter(g => g.sec === "think").map(g => g.id))[0]]; } finally { rnd = was; }
  opts.wk = { d: k, ids, done: [] }; return opts.wk;
}

  const w = workoutToday(), done = w.ids.filter(id => w.done.includes(id)).length, next = w.ids.find(id => !w.done.includes(id)), all = !next;
  return `<div class="wcard"><div class="wtop"><b>Today's workout</b><small>${done} of 3 done</small></div>
    <div class="wlist">${w.ids.map(id => `<span class="${w.done.includes(id) ? "ok" : ""}">${MGI[id].icon} ${MGI[id].name}${w.done.includes(id) ? " ✓" : ""}</span>`).join("")}</div>
    <button class="hbtn${all ? "" : " go"}" id="hwork"><span><b>${all ? "Workout done ✓" : done ? `Next: ${MGI[next].name}` : "Start the workout"}</b><small>${all ? "A new one tomorrow" : "Three short games, a few minutes"}</small></span><i>›</i></button></div>`;
}

/* the menu */

}

/* one game: intro, play, result */
function mgHead(title, extra) { return `<div class="mghead"><button class="pback" id="mgback" aria-label="Back">${BACK_SVG}</button><b class="t">${title}</b>${extra || ""}</div>`; }
function mgOpen(id, o) {
  const g = MGI[id]; if (!g) return;
  mgClear(); mgCur = { g, lv: Math.min(g.levels, (mgRead(id) || {}).lv || 1), workout: !!(o && o.workout) };
  mgEl.hidden = false; mgIntro();
}
function mgIntro() {
  mgClear(); mgView = "intro"; const { g, lv } = mgCur, s = mgRead(g.id), b = s && s.best[lv];
  mgEl.innerHTML = `<div class="mgin">${mgHead(g.name)}
    <div class="mgintro">
      <div class="mgic" aria-hidden="true">${g.icon}</div>

        <div><b>Level ${lv} of ${g.levels}</b><small>${g.levelName(lv)}</small></div>
        <button id="lvup" aria-label="Harder level"${lv >= g.levels ? " disabled" : ""}>+</button></div>
      <p class="mgsub">${b != null ? `Your best at this level: <b>${g.fmt(b)}</b>` : s && s.plays ? "No score at this level yet." : "Start low and go up a level when it feels easy."}</p>
      ${opts.relaxed ? `<p class="mgsub">Relaxed mode is on: more time to look, no rush.</p>` : ""}
    </div>
    <button class="bigbtn" id="mgstart">Start</button></div>`;
  $("mgback").onclick = mgClose;

  $("lvup").onclick = () => { mgCur.lv = Math.min(g.levels, lv + 1); mgIntro(); };
  $("mgstart").onclick = mgPlay;
}
function mgPlay() {

  mgEl.innerHTML = `<div class="mgin">${mgHead(g.name, `<button class="pback q" id="mghelp" aria-label="How to play">?</button>`)}
    <div class="mgstat" id="mgstat" role="status"></div><div class="mgbody" id="mgbody"></div><div class="mgfoot" id="mgfoot"></div></div>`;
  $("mgback").onclick = () => mgIntro();

    stat: html => { if (mgCur && mgCur.token === token) $("mgstat").innerHTML = html; },
    later: (fn, ms) => { const id = setTimeout(() => { if (mgCur && mgCur.token === token && mgView === "play") fn(); }, ms); mgTimers.push(id); return id; },
    alive: () => !!mgCur && mgCur.token === token && mgView === "play",

}
function mgHelp() {
  const g = mgCur.g; sheet = "mghelp";

    <div class="row2"><button class="big go" data-close>Got it</button></div></div>`;

}
function mgClose() { mgClear(); mgCur = null; mgView = null; mgEl.hidden = true; mgEl.innerHTML = ""; showHome(); }

  if (isBest) s.best[lv] = res.score;

  opts.hist = opts.hist || []; opts.hist.push({ d: k, k: g.id, lv, s: res.score, t: secs });
  if (opts.hist.length > 600) opts.hist.splice(0, opts.hist.length - 600);

    <div class="winhead"><b>${res.title || "Well done!"}</b><span>${g.name} · level ${lv}</span></div>

addGame({
  id: "seq", name: "Repeat the sequence", icon: "🎵", sec: "mem", blurb: "Watch the pads, then repeat them", levels: 8, better: "high",

  fmt: s => s + (s === 1 ? " step" : " steps"),
  start(c) {

    const seq = [], grid = document.createElement("div"); grid.className = "pads wait";
    let pos = 0, mode = "watch", best = 0, chances = c.relaxed ? 1 : 0;
    mgCur.peek = () => ({ seq, mode });
    const pads = range(n).map(i => {
      const b = document.createElement("button"); b.className = "spad"; b.style.background = PAD_COL[i]; b.innerHTML = `<span>${i + 1}</span>`; b.setAttribute("aria-label", "Pad " + (i + 1));

    });

    const say = (t, cls) => c.stat(`<span class="${cls || ""}">${t}</span><span>Steps <b>${seq.length}</b></span>`);
    const light = (i, dur) => { pads[i].classList.add("lit"); beep(PAD_F[i], Math.min(.55, dur / 1000)); c.later(() => pads[i].classList.remove("lit"), Math.max(180, dur * .65)); };

addGame({
  id: "squares", name: "Remember the squares", icon: "🔲", sec: "mem", blurb: "Some squares light up: tap the same ones", levels: 8, better: "high",
  how: "Some squares in the grid light up for a moment. When they go dark, tap the same squares, in any order. Each time you get them all, one more lights up. A wrong square costs a life; you have three.",
  levelName: l => { const [k, ms] = SQ_LV[l - 1]; return `start with ${k} · ${ms >= 1500 ? "long look" : "short look"}`; },
  fmt: s => s + " squares",
  start(c) {
    let K = SQ_LV[c.lv - 1][0], lives = 3, best = 0, mode = "wait", lit = new Set(), got = new Set(), els = [], grid = null, side = 0;
    const show = Math.round(SQ_LV[c.lv - 1][1] * (c.relaxed ? 1.7 : 1));

      side = sqSide(K); c.body.innerHTML = ""; grid = document.createElement("div"); grid.className = "sqs";

const ST_NAMES = ["Anna", "Ben", "Clara", "Daniel", "Eva", "Frank", "Grace", "Henry", "Iris", "Jacob", "Lily", "Max", "Nora", "Oscar", "Rosa", "Simon", "Leah", "Adam", "Maya", "Noah"];

const pick1 = a => a[randInt(a.length)];
const cap = s => s[0].toUpperCase() + s.slice(1);
function makeStory(nFacts) {
  const [who, friend] = pickN(ST_NAMES, 2), day = pick1(ST_DAYS), time = pick1(ST_TIMES), place = pick1(ST_PLACES), travel = pick1(ST_TRAVEL);
  const weather = pick1(ST_WEATHER), rel = pick1(ST_REL), color = pick1(ST_COLORS), thing = pick1(ST_THINGS), many = pick1(ST_MANY), one = pick1(ST_ONE);
  const k = 2 + randInt(8), price = 5 + randInt(40), home = 1 + randInt(11), nums = range(9).map(x => String(x + 2));
  const facts = [

    { s: `${who} went ${travel}.`, q: [[`How did ${who} get there?`, cap(travel), ST_TRAVEL.map(cap)]] },
    { s: `It was a ${weather} day.`, q: [[`What was the weather like?`, cap(weather), ST_WEATHER.map(cap)]] },
    { s: `${who} bought ${k} ${many}.`, q: [[`How many ${many} did ${who} buy?`, String(k), nums], [`What did ${who} buy ${k} of?`, cap(many), ST_MANY.map(cap)]] },
    { s: `There, ${who} met ${friend}, ${rel}.`, q: [[`Who did ${who} meet?`, friend, ST_NAMES.filter(x => x !== who)], [`Who was ${friend}?`, cap(rel), ST_REL.map(cap)]] },
    { s: `${friend} had a ${color} ${thing}.`, q: [[`What colour was ${friend}'s ${thing}?`, cap(color), ST_COLORS.map(cap)], [`What did ${friend} have?`, `A ${thing}`, ST_THINGS.map(t => "A " + t)]] },
    { s: `Before going home, ${who} also bought ${one}.`, q: [[`What else did ${who} buy?`, cap(one), ST_ONE.map(cap)]] },
    { s: `Everything cost ${price} dollars.`, q: [[`How much did it all cost?`, `${price} dollars`, range(40).map(x => `${x + 5} dollars`)]] },
    { s: `${who} was home again at ${home} o'clock.`, q: [[`What time was ${who} home?`, `${home} o'clock`, range(11).map(x => `${x + 1} o'clock`)]] },

/* ---------- Quick sums ---------- */
const QS_LV = ["add up to 18", "add and take away up to 20", "add and take away up to 50", "times tables 2 to 5, add, take away",
  "times tables to 10, sharing", "all four, up to 100", "two steps", "bigger numbers"];
function qsMake(l) {
  const r = (a, b) => a + randInt(b - a + 1), T = (q, a) => ({ q, a });
  const add = m => { const a = r(1, m - 1), b = r(1, m - a); return T(`${a} + ${b}`, a + b); };
  const sub = m => { const a = r(2, m), b = r(1, a - 1); return T(`${a} − ${b}`, a - b); };
  const mul = (lo, hi) => { const a = r(lo, hi), b = r(2, 10); return T(`${a} × ${b}`, a * b); };
  const div = hi => { const b = r(2, hi), a = r(2, 10); return T(`${a * b} ÷ ${b}`, a); };
  const any = fs => fs[randInt(fs.length)]();
  switch (l) {
    case 1: return T(...(() => { const a = r(1, 9), b = r(1, 9); return [`${a} + ${b}`, a + b]; })());
    case 2: return any([() => add(20), () => sub(20)]);
    case 3: return any([() => add(50), () => sub(50)]);
    case 4: return any([() => mul(2, 5), () => add(50), () => sub(50)]);
    case 5: return any([() => mul(2, 10), () => mul(2, 10), () => div(10)]);
    case 6: return any([() => add(100), () => sub(100), () => mul(2, 12), () => div(12)]);
    case 7: return any([() => { const a = r(2, 9), b = r(2, 9), c = r(1, 20); return T(`${a} × ${b} + ${c}`, a * b + c); },
      () => { const a = r(10, 60), b = r(2, 30), c = r(1, Math.min(30, a + b - 1)); return T(`${a} + ${b} − ${c}`, a + b - c); },
      () => { const b = r(2, 9), a = r(2, 9), c = r(1, 9); return T(`${a * b} ÷ ${b} + ${c}`, a + c); }]);
    default: return any([() => { const a = r(12, 99), b = r(3, 9); return T(`${a} × ${b}`, a * b); }, () => add(500), () => sub(500), () => div(12),
      () => { const a = r(100, 400), b = r(20, 99); return T(`${a} − ${b}`, a - b); }]);
  }
}
function qsChoices(a) {
  const s = new Set([a]), near = [1, 2, 10, -1, -2, -10, 3, 5, -3, 11, -11, 9, -9];
  for (const d of shuffle(near.slice())) { if (s.size >= 4) break; if (a + d >= 0) s.add(a + d); }
  while (s.size < 4) s.add(a + s.size + 7);
  return shuffle([...s]);
}

  if (sheet === "mghelp") { closeSheet(); return true; }
  if (sheet === "mgres") { $("mgmenu").click(); return true; }
  if (!sheet && mgView === "play") { mgIntro(); return true; }
  if (!sheet && mgView === "intro") { mgClose(); return true; }
  if (sheet === "daily") { closeSheet(); if (homeOn) showHome(); return true; }
  if (statOn && !sheet) { closeStats(); return true; }
  if (sheet === "new" && newMode !== "solo") { $("newback").click(); return true; }
  if (sheet === "vs" || sheet === "vslost" || sheet === "vsleave") { closeSheet(); return true; }
  if (sheet === "vsjoin") { $("vsback").click(); return true; }
  if (sheet === "vsinvite") { $("vsno").click(); return true; }
  if (sheet === "vsend") { closeSheet(); showHome(); return true; }   // still connected: a rematch from the friend can still come
  if (sheet === "vswait" || sheet === "vschk" || sheet === "making") return true;
  if (sheet === "settings") { closeSheet(); if (homeOn) showHome(); return true; } if (sheet === "new" && (homeOn || (G && !G.done))) { closeSheet(); return true; } if (homeOn && homeView === "sudoku") { homeView = "hub"; showHome(); return true; } if (homeOn) return false; if (sheet === "win") { closeSheet(); showHome(); return true; } if (paused) { paused = false; render(); return true; } if (sel >= 0) { sel = -1; render(); return true; } showHome(); return true; };
window.appPause = () => { if (G && !G.done) { paused = true; render(); } save(); };

/* ---------- updates, also mid-game ---------- */
// Every few minutes (and when the app comes back) the game asks the update site for a newer version. If there is one,
// a banner offers it; Update swaps the new game in on the spot and returns to the same puzzle (it is saved first).
// The app itself also downloads it, so the next opening uses it too.
const SITE = window.SUDOKU_SITE || "https://tomvinograd.github.io/glimmer-isle-play/sudoku/";
let updLater = 0, updBusy = false;
async function checkUpdate() {
  if (!window.GAME_BUILD || updBusy || document.querySelector(".upd")) return;
  try {
    const r = await fetch(SITE + "version.txt?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const v = parseInt((await r.text()).trim(), 10);
    if (v > window.GAME_BUILD && v !== updLater) showUpd(v);
  } catch (e) {}
}
function showUpd(v) {
  const b = document.createElement("div"); b.className = "upd"; b.setAttribute("role", "status");
  b.innerHTML = `<div><b>New version ready</b><span>Update now: your game stays where it is.</span></div><button class="later">Later</button><button class="go">Update</button>`;
  b.querySelector(".later").onclick = () => { updLater = v; b.remove(); };
  b.querySelector(".go").onclick = () => applyUpd(v, b);
  document.body.appendChild(b);
}
async function applyUpd(v, b) {
  if (updBusy || sheet === "making") return;
  updBusy = true; b.querySelector("span").textContent = "Updating..."; b.querySelectorAll("button").forEach(x => x.disabled = true);
  try {
    save();
    if (location.protocol !== "file:") { location.reload(); return; }   // opened from the website: just reload
    const r = await fetch(SITE + "game.html?v=" + v, { cache: "no-store" }), html = await r.text();
    if (!r.ok || !html.includes("window.GAME_BUILD = " + v + ";")) throw new Error("bad download");
    clearInterval(tickId); clearInterval(updTimer); clearInterval(vsTimer); if (ves) ves.close(); ves = null; if (darkQuery && darkQuery.removeEventListener) darkQuery.removeEventListener("change", applyTheme);
    document.open(); document.write(html); document.close();   // the new game takes over this page (same saved game)
  } catch (e) {
    updBusy = false; b.querySelector("span").textContent = "Couldn't update right now. It tries again later.";
    setTimeout(() => b.remove(), 4000);
  }
}
const updTimer = setInterval(checkUpdate, 3 * 60 * 1000);
setTimeout(checkUpdate, 15000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { checkUpdate(); vsCatchUp(); } });
const vsTimer = setInterval(() => { if (V && vready && (!ves || ves.readyState === 2)) vsConnect(); }, 20000);   // the race connection comes back by itself
// for the tap tests
window.__sd = { get G() { return G; }, get sel() { return sel; }, get notesMode() { return notesMode; }, get paused() { return paused; }, get sheet() { return sheet; },
  get opts() { return opts; }, get homeOn() { return homeOn; }, get V() { return V; }, get vlog() { return vlog; }, get vnet() { return vnet; },
  get statOn() { return statOn; }, get sfxCount() { return sfxCount; },
  get mgView() { return mgView; }, workoutToday, get mgCur() { return mgCur; }, mgOpen, MGI, set homeView(v) { homeView = v; },
  startGame, showHome, enter, render, checkUpdate, vsRounds, openDaily, openStats, makeDaily, dayKey, streakNow, setSel(i) { sel = i; } };

/* ---------- start ---------- */
const NEWS = "Daily workout: three short games a day, at the top of the menu. Stats now cover every game, and there are 3 new badges.";   // change with each update
let hadSave = false; try { hadSave = !!localStorage.getItem(KEY); } catch (e) {}
load();
if (V && (V.joining || !V.code)) V = null;              // was still looking for a game: start that again by hand
if (V && !V.told) V.told = {};
if (G && G.vs && (!V || V.round !== G.vs)) delete G.vs;
if (G && G.done && !G.vs) G = null;
if (opts.shelf && opts.shelf.done) opts.shelf = null;
if (!opts.badges) { opts.badges = {}; checkBadges(null); }   // first time with badges: earn what earlier play already shows, quietly
applyTheme();
fitBoard();
let resume = false; try { resume = sessionStorage.getItem("sudoku.resume") === "1"; } catch (e) {}
if (G) render();
if (G && !G.done && resume) { paused = false; hideHome(); render(); } else showHome();
if (V) { vsConnect(); if (counting()) vsCount(); }
if (window.GAME_BUILD) {
  if (hadSave && opts.seenBuild !== window.GAME_BUILD) {
    const n = document.createElement("div"); n.className = "news"; n.setAttribute("role", "status");
    n.innerHTML = `<div><b>Updated!</b><span>${NEWS}</span></div><button>Nice</button>`;
    n.querySelector("button").onclick = () => n.remove(); document.body.appendChild(n); setTimeout(() => n.remove(), 9000);
  }
  opts.seenBuild = window.GAME_BUILD; save();
}
})();
