<!doctype html>
<html lang="en">
<head>
<script>window.GT_BUILD=1795598313</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FF8A1F">
<title>Go Travel</title>
<link rel="stylesheet" href="lib/maplibre-gl.css">
<link rel="stylesheet" href="game.css">
</head>
<body>
<div id="map"></div>

<header id="hud">
  <button class="lvl" id="hudLvl" data-go="me"><b id="lvNum">1</b><span class="bar"><i id="lvBar"></i></span></button>
  <div class="score" id="hudPts"><span class="star">★</span><b id="ptsNum">0</b></div>
</header>

<div id="banner" hidden></div>
<button id="fchip" hidden></button>

<button id="btnMe" class="roundbtn" aria-label="Center on me"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" /></svg></button>

<section id="idle" class="dock">
  <div class="today"><span data-t="today"></span> <b id="todayNew">0 m</b> <span data-t="newPaths"></span></div>
  <button id="btnStart" class="go"><span data-t="start"></span></button>
</section>

<section id="rec" class="dock" hidden>
  <div class="recrow">
    <div class="mode" id="recMode">🚶</div>
    <div class="stat"><b id="recTime">0:00</b><small data-t="time"></small></div>
    <div class="stat"><b id="recDist">0.00</b><small data-t="km"></small></div>
    <div class="stat new"><b id="recNew">0</b><small data-t="newM"></small></div>
    <div class="stat"><b id="recPts">0</b><small data-t="points"></small></div>
  </div>
  <div class="recnote" id="recNote" hidden></div>
  <div class="recact">
    <span class="steps"><span data-t="steps"></span> <b id="recSteps">–</b></span>
    <button id="btnStop" class="stop"><span data-t="finish"></span></button>
  </div>
</section>

<nav id="tabs">
  <button data-go="map" class="on"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span data-t="tabMap"></span></button>
  <button data-go="trips"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-t="tabTrips"></span></button>
  <button data-go="friends"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 5"/></svg><span data-t="tabFriends"></span></button>
  <button data-go="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span data-t="tabMe"></span></button>
</nav>

<section id="page" class="page" hidden>
  <header class="phead"><button class="back" id="pBack" aria-label="Back">‹</button><h1 id="pTitle"></h1></header>
  <div class="pbody" id="pBody"></div>
</section>

<div id="layer"></div>
<div id="toast" hidden></div>

<script src="lib/capacitor.js"></script>
<script src="lib/maplibre-gl.js"></script>
<script src="lib/vt.js"></script>
<script src="engine.js"></script>
<script src="achieve.js"></script>
<script src="net.js"></script>
<script src="i18n.js"></script>
<script src="game.js"></script>
</body>
</html>
